<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Robey's Wild Adventures</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="game-root"></div>
    <div id="touch-controls" class="hidden">
      <div id="dpad">
        <button id="btn-left" class="dpad-btn" aria-label="Move left">
          <span class="btn-icon">&#9664;</span>
        </button>
        <button id="btn-right" class="dpad-btn" aria-label="Move right">
          <span class="btn-icon">&#9654;</span>
        </button>
      </div>
      <div id="action-buttons">
        <button id="btn-jump" class="action-btn jump-btn" aria-label="Jump">
          <span class="btn-icon">&#10514;</span>
          <span class="btn-label">JUMP</span>
        </button>
        <button id="btn-slash" class="action-btn slash-btn" aria-label="Slash">
          <span class="btn-icon">&#9876;</span>
          <span class="btn-label">SLASH</span>
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
