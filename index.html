<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Robey's Wild Adventures</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="game-root"></div>
    <div id="touch-controls" class="hidden">
      <div id="dpad">
        <button id="btn-left" class="dpad-btn" aria-label="Left">&#9664;</button>
        <button id="btn-right" class="dpad-btn" aria-label="Right">&#9654;</button>
      </div>
      <div id="action-buttons">
        <button id="btn-jump" class="action-btn" aria-label="Jump">JUMP</button>
        <button id="btn-slash" class="action-btn" aria-label="Slash">SLASH</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
